services:
  buku-induk-sma:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buku-induk-siswa-sma
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./bis_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Jakarta
