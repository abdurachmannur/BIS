server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresi Gzip untuk mempercepat pemuatan tabel dan aset aplikasi
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Dukungan Routing Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis (JS, CSS, Font, Gambar)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
